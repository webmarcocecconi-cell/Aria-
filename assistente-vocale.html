<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ARIA — Assistente Vocale</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f1a; --surface: #161829; --card: #1e2035; --accent: #7c6dfa;
    --accent2: #f472b6; --accent3: #34d399; --text: #e8eaf6; --muted: #6b7280;
    --border: rgba(124,109,250,0.2); --state-listening: #34d399;
    --state-thinking: #fbbf24; --state-speaking: #f472b6; --state-countdown: #7c6dfa;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background-color: var(--bg); color: var(--text); font-family: 'Nunito', sans-serif; overflow: hidden; height: 100vh; width: 100vw; display: flex; flex-direction: column; }
  .app-container { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; width: 100%; max-width: 600px; margin: 0 auto; }
  header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: rgba(22,24,41,0.6); backdrop-filter: blur(10px); z-index: 10; }
  .logo-title { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 1.2rem; color: var(--text); }
  .nav-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .face-section { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 1; padding: 20px; }
  .avatar-container { width: 230px; height: 230px; position: relative; }
  .anime-avatar-img { width: 100%; height: 100%; border-radius: 50%; background-image: url('aria.png'); background-size: cover; background-position: center; border: 3px solid var(--border); }
  .status-badge { margin-top: 25px; padding: 6px 16px; border-radius: 20px; background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .controls-section { padding: 20px 20px 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; background: linear-gradient(to top, var(--bg) 70%, transparent); }
  .action-row { display: flex; align-items: center; justify-content: center; gap: 25px; width: 100%; }
  .mic-btn { width: 76px; height: 76px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #6366f1); border: none; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .secondary-btn { width: 46px; height: 46px; border-radius: 50%; background: var(--card); border: 1px solid var(--border); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .history-preview { width: 100%; background: rgba(30,32,53,0.4); border: 1px solid rgba(124,109,250,0.1); border-radius: 14px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; font-size: 0.85rem; cursor: pointer; }
  .modal-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(13,15,26,0.85); backdrop-filter: blur(8px); z-index: 100; display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal-sheet { width: 100%; background: var(--surface); border-top: 1px solid var(--border); border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 24px; max-height: 80%; }
</style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="logo-title">ARIA</div>
    <div style="display:flex; gap:10px;">
      <button class="nav-btn" id="btnHistory"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></button>
      <button class="nav-btn" id="btnSettings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
  </header>

  <main class="face-section">
    <div class="avatar-container"><div class="anime-avatar-img"></div></div>
    <div class="status-badge"><span class="status-dot"></span><span id="statusText">PRONTA</span></div>
  </main>

  <section class="controls-section">
    <div class="action-row">
      <button class="secondary-btn" id="btnMute">M</button>
      <button class="mic-btn" id="btnMic">MIC</button>
      <button class="secondary-btn" id="btnChooseVoice">V</button>
    </div>
    <div class="history-preview" id="historyPreview"><span id="historyPreviewText">Nessuna conversazione</span></div>
  </section>
</div>

<script>
  // Logica di base per far ripartire i bottoni
  document.getElementById('btnMic').onclick = () => alert("Microfono attivato");
  document.getElementById('btnHistory').onclick = () => document.getElementById('modalHistory').classList.add('open');
  document.getElementById('btnSettings').onclick = () => document.getElementById('modalSettings').classList.add('open');
  document.getElementById('btnChooseVoice').onclick = () => document.getElementById('modalVoice').classList.add('open');
</script>
</body>
</html>
