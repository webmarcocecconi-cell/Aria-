<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARIA — Assistente Vocale</title>
<style>
  /* Stili invariati, mantieni i tuoi */
  :root { --bg: #0d0f1a; --accent: #7c6dfa; --text: #e8eaf6; }
  body { background-color: var(--bg); color: var(--text); font-family: sans-serif; }
  .avatar-container { width: 230px; height: 230px; position: relative; margin: 0 auto; }
  .anime-avatar-img { width: 100%; height: 100%; border-radius: 50%; background-image: url('aria.png'); background-size: cover; }
</style>
</head>
<body>

<div class="app-container">
  <main class="face-section">
    <div class="avatar-container" id="avatarContainer">
      <div class="anime-avatar-img"></div>
    </div>
  </main>

  <section class="controls-section">
    <button id="btnMic">Microfono</button>
    <button id="btnChooseVoice">Voce</button>
    <button id="btnHistory">Cronologia</button>
  </section>
</div>

<script>
// Caricamento sicuro
document.addEventListener('DOMContentLoaded', function() {
    console.log("Inizializzazione componenti...");

    // Collegamento sicuro agli elementi
    var btnMic = document.getElementById('btnMic');
    var btnHistory = document.getElementById('btnHistory');
    var btnChooseVoice = document.getElementById('btnChooseVoice');

    if(btnMic) {
        btnMic.onclick = function() {
            alert("Microfono attivo!");
            // Inserisci qui la logica di recognition
        };
    }

    if(btnHistory) {
        btnHistory.onclick = function() {
            alert("Apertura cronologia...");
        };
    }

    if(btnChooseVoice) {
        btnChooseVoice.onclick = function() {
            alert("Selezione voce...");
        };
    }

    console.log("Componenti caricati con successo.");
});
</script>
</body>
</html>
